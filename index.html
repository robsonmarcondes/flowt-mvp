<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOWT — Entrar</title>
<style>
:root{--bg:#f4f6fb;--dark:#111827;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}.brand{background:var(--dark);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:center}
.brand h1{font-size:56px;letter-spacing:.12em;margin:0 0 18px}.brand p{font-size:20px;color:#cbd5e1;max-width:540px;line-height:1.5}
.wrap{display:grid;place-items:center;padding:30px}.card{width:min(420px,100%);background:#fff;padding:28px;border-radius:20px;box-shadow:0 14px 40px rgba(18,28,45,.1)}
h2{margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.field{margin-top:16px}label{display:block;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.primary,.secondary{display:block;width:100%;padding:12px;border-radius:10px;text-align:center;text-decoration:none;font-weight:700;margin-top:12px}
.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--text)}
.switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}.switch a{color:var(--accent);font-weight:700;text-decoration:none}
.version{position:fixed;right:12px;bottom:10px;font-size:11px;color:#9ca3af}
@media(max-width:850px){.auth{grid-template-columns:1fr}.brand{display:none}}
</style>
</head>
<body>
<div class="auth">
  <section class="brand">
    <h1>FLOWT</h1>
    <p>Organize o que importa, execute melhor seu dia e acompanhe sua evolução em uma única conta.</p>
  </section>
  <section class="wrap">
    <form class="card" action="dashboard.html" method="get">
      <h2>Entrar</h2>
      <p class="muted">Acesse o protótipo e continue seu dia.</p>
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required placeholder="voce@email.com"></div>
      <div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required placeholder="••••••••"></div>
      <button class="primary" type="submit">Entrar</button>
      <a class="secondary" href="dashboard.html?google=1">Continuar com Google</a>
      <div class="switch">Ainda não tem conta? <a href="signup.html">Criar conta</a></div>
    </form>
  </section>
</div>
<div class="version">FLOWT V2.1</div>
</body>
</html>
